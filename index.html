<meta charset="utf-8">
<title>말랑별 토끼마을</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: storybook HUD over a living village picture; the scene is the game board, a side "notice board" panel holds requests, family tree and journal. Single warm daylight look by choice. */
:root{
  color-scheme: light;
  --meadow:#e7f0dc;      /* page ground, misty grass */
  --paper:#fffdf7;       /* cards, sheets */
  --ink:#4a3326;         /* cocoa ink */
  --ink-soft:#7d6656;
  --line:#e3d6c3;
  --berry:#f2708c;       /* strawberry accent (cream bunny's cake) */
  --berry-deep:#d14f6e;
  --sky:#7fc0ef;         /* cloud bunny */
  --honey:#f0b54a;       /* crust / caramel */
  --night:#2b2a5c;       /* aurora night */
  --good:#4f9d5b;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--meadow);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px;
  background-image:radial-gradient(circle at 12% 0%,#fff6 0,transparent 40%),radial-gradient(circle at 90% 100%,#cfe3c066 0,transparent 45%)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}

.wrap{max-width:1360px;margin:0 auto;display:grid;gap:14px}
/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-size:clamp(26px,3.4vw,38px);color:var(--ink);line-height:1}
.brand h1 span{color:var(--berry)}
.brand small{color:var(--ink-soft);font-size:13px}
.stat{display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:5px 14px 5px 10px;font-family:var(--display);font-size:16px}
.stat b{font-weight:400;color:var(--ink-soft);font-size:13px;font-family:var(--body)}
.pips{display:flex;gap:4px}
.pip{width:12px;height:12px;border-radius:50%;background:var(--honey);box-shadow:inset 0 -2px 0 #0002}
.pip.off{background:var(--line);box-shadow:none}
.harm{width:120px;height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.harm i{display:block;height:100%;background:linear-gradient(90deg,var(--honey),var(--berry));border-radius:9px;transition:width .6s}
.btn{border:0;border-radius:999px;padding:9px 18px;background:var(--ink);color:var(--paper);font-family:var(--display);font-size:16px;box-shadow:0 3px 0 #0003;transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0003}
.btn.alt{background:var(--paper);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.pink{background:var(--berry);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:20px;padding:12px 28px}

/* main grid */
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.scene{position:relative;aspect-ratio:3/2;max-width:100%;border-radius:22px;overflow:hidden;border:4px solid var(--paper);box-shadow:0 10px 30px #4a332633;background:#eef3e8;touch-action:manipulation;isolation:isolate}
.scene .bg{position:absolute;inset:0;background:url(assets/village-empty.jpg) center/cover no-repeat;filter:saturate(.76) contrast(.9) brightness(1.04)}
.scene .bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 75% at 50% 58%,transparent 55%,#fff7f285 100%),linear-gradient(#ffffff5c,#ffffff00 34%),#ffe4ee1f}
.scene .fluff{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.scene .tint{position:absolute;inset:0;pointer-events:none;background:var(--night);opacity:0;transition:opacity 1.2s;mix-blend-mode:multiply;z-index:1500}
/* living bunnies */
.bun{position:absolute;transform:translate(-50%,-94%);border:0;background:transparent;padding:0;aspect-ratio:1/1;display:grid;align-items:end}
.bun img{position:relative;width:100%;display:block;transform-origin:50% 92%;animation:float 3.8s ease-in-out infinite;animation-delay:var(--d,0s);transition:transform .5s,filter .5s;pointer-events:none;filter:drop-shadow(0 0 1.5px #fffd) drop-shadow(0 6px 8px #6a4a3a26)}
.bun::before{content:"";position:absolute;left:20%;right:20%;bottom:3%;height:9%;border-radius:50%;background:radial-gradient(closest-side,#5a3d2c38,#5a3d2c00);animation:shade 3.8s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
@keyframes shade{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.8);opacity:.55}}
.bun.walking img{animation:hopwalk .62s ease-in-out infinite}
.bun.walking::before{animation:shade .62s ease-in-out infinite}
@keyframes hopwalk{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-16%) scale(.98,1.03)}}
.bun.shrink img{animation:none;transform:scale(.68,.6)}
.bun.melt img{animation:none;transform:scale(1.1,.82)}
.bun.glowy img{filter:drop-shadow(0 0 10px #ffc861) drop-shadow(0 0 22px #ffb84d)}
.bun.hopnow img{animation:hop .5s}
.bun .tag{position:absolute;left:50%;top:100%;transform:translate(-50%,-30%);white-space:nowrap;background:var(--paper);color:var(--ink);font-family:var(--display);font-size:clamp(10px,1.1vw,14px);padding:1px 9px;border-radius:999px;box-shadow:0 2px 0 #0002;opacity:0;transition:opacity .2s;pointer-events:none}
.bun:hover .tag,.bun:focus-visible .tag,.scene.labels .bun .tag{opacity:1}
.bun .ask{position:absolute;left:66%;top:8%;width:clamp(18px,2.1vw,28px);aspect-ratio:1;border-radius:50%;background:var(--berry);color:#fff;font-family:var(--display);display:grid;place-items:center;font-size:clamp(11px,1.3vw,17px);box-shadow:0 2px 0 var(--berry-deep);animation:bob 1.4s ease-in-out infinite}
.sayb{position:absolute;left:50%;bottom:96%;transform:translateX(-50%);width:max-content;max-width:min(230px,40vw);background:#fffdf7f2;border-radius:18px!important;color:var(--ink);font-family:var(--body);font-size:clamp(11px,1.15vw,14px);line-height:1.35;padding:6px 11px;border-radius:14px;box-shadow:0 3px 0 #0002;pointer-events:none;animation:pop .2s;z-index:2}
.sayb::after{content:"";position:absolute;left:50%;top:100%;margin-left:-7px;border:7px solid transparent;border-top-color:#fffdf7}
/* decorations */
.deco{position:absolute;transform:translate(-50%,-96%);pointer-events:none}
.deco svg{width:100%;height:auto;display:block;overflow:visible}
.scene.decorating .deco{pointer-events:auto;cursor:grab;outline:2px dashed #fffc;outline-offset:2px;border-radius:8px}
.deco .rm{display:none;position:absolute;right:-10px;top:-10px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-size:12px;line-height:24px;padding:0}
.scene.decorating .deco .rm{display:block}
.scene.night .deco.lamp{z-index:1600!important}
.scene.night .deco.lamp svg{filter:drop-shadow(0 0 8px #ffd27a) drop-shadow(0 0 18px #ffb84d)}
.scene.placing{cursor:crosshair}
.rain{position:absolute;inset:0;z-index:1550;pointer-events:none;opacity:0;transition:opacity .8s;
  background:repeating-linear-gradient(105deg,transparent 0 18px,#ffffffaa 18px 20px,transparent 20px 37px),#5f7fa055;background-size:120px 120px;animation:rain .35s linear infinite}
.scene.raining .rain{opacity:1}
@keyframes rain{to{background-position:-30px 120px}}
.flash{position:absolute;inset:0;background:#fff;z-index:1650;pointer-events:none;animation:flash .5s forwards}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:1700;display:flex;gap:10px;align-items:center;background:#fffdf7f0;border-radius:999px;padding:6px 8px 6px 16px;font-family:var(--display);font-size:clamp(13px,1.5vw,17px);box-shadow:0 4px 14px #0003;white-space:nowrap;max-width:calc(100% - 20px)}
.banner span{overflow:hidden;text-overflow:ellipsis}
.banner .btn{padding:4px 12px;font-size:14px}
.evchip{position:absolute;right:10px;top:10px;z-index:1700;border:0;background:var(--berry);color:#fff;font-family:var(--display);font-size:clamp(13px,1.4vw,16px);border-radius:999px;padding:6px 14px;box-shadow:0 3px 0 var(--berry-deep);animation:bob 1.6s ease-in-out infinite}
.choice{display:grid;gap:8px}
.choice .btn{text-align:left;border-radius:14px;font-size:16px}
.deco-card{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px;background:#fffaf0}
.deco-card .pv{width:64px;height:64px;display:grid;place-items:center;background:var(--meadow);border-radius:12px}
.deco-card .pv svg{width:52px;height:52px}
.deco-card h3{font-size:16px;line-height:1.2}
.deco-card small{color:var(--ink-soft);font-size:12px}
.deco-card .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.deco-card .btn{padding:4px 12px;font-size:14px}
.deco-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.scene.night .tint{opacity:.72}
.scene .glow{position:absolute;left:79%;top:80%;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#ffb84d88 0,#ff8a3d33 35%,transparent 65%);opacity:0;mix-blend-mode:screen}
.scene.cracks .glow{animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.15}50%{opacity:.85}}
@keyframes bob{50%{transform:translateY(-5px)}}
.scene-bar{position:absolute;left:10px;bottom:10px;display:flex;gap:8px}
.chip{background:#fffdf7e6;border-radius:999px;padding:4px 12px;font-size:13px;border:0}
.float{position:absolute;pointer-events:none;font-family:var(--display);font-size:clamp(14px,1.8vw,22px);color:#fff;text-shadow:0 2px 0 var(--ink),0 0 6px #0006;animation:up 1.4s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes up{to{transform:translate(-50%,-180%);opacity:0}}

/* inventory */
.inv{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px}
@media (max-width:700px){.inv{grid-template-columns:repeat(5,minmax(0,1fr))}}
.slot{background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:6px 4px;text-align:center;display:grid;gap:0;min-width:0}
.slot .ic{font-size:22px;line-height:1.2}
.slot .n{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.slot .l{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.15);border-color:var(--honey)}}

/* side panel */
.panel{background:var(--paper);border-radius:var(--r);border:2px solid var(--line);overflow:hidden;min-width:0}
.tabs{display:flex;border-bottom:2px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:12px 6px;font-family:var(--display);font-size:16px;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--berry)}
.tabbody{padding:14px;display:grid;gap:12px;max-height:620px;overflow:auto}
.quest{border:2px dashed var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:#fffaf0}
.quest.big{border-color:var(--honey);background:#fff6df}
.quest.mystery{background:#f1eef8;border-color:#b9b0d8}
.qhead{display:flex;gap:10px;align-items:center}
.qhead img{width:44px;height:44px;object-fit:contain}
.qhead h3{font-size:17px;line-height:1.2}
.qhead small{color:var(--ink-soft);font-size:12px;display:block}
.quest p{margin:0;font-size:14px}
.needs{display:flex;flex-wrap:wrap;gap:6px}
.need{font-size:13px;border-radius:999px;padding:2px 9px;background:var(--meadow);font-variant-numeric:tabular-nums}
.need.ok{background:#dcefd9;color:var(--good)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft)}
.qfoot .btn{padding:6px 14px;font-size:15px}

.fam{display:grid;gap:10px}
.fgroup{border-radius:14px;padding:10px 12px;background:var(--meadow)}
.fgroup h3{font-size:16px}
.fgroup p{margin:2px 0 8px;font-size:13px;color:var(--ink-soft)}
.fmembers{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fm{display:grid;justify-items:center;width:70px;border:0;background:transparent;padding:0}
.fm img{width:56px;height:56px;object-fit:contain;transition:transform .2s}
.fm:hover img{transform:translateY(-3px) rotate(-4deg)}
.fm span{font-size:12px;font-family:var(--display)}
.hearts{font-size:10px;letter-spacing:1px;color:var(--berry)}
.link{font-size:12px;color:var(--ink-soft);padding:0 2px}
.link.maybe{border-bottom:2px dotted var(--ink-soft)}
.bridge{font-size:13px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px}

.journal{display:grid;gap:10px}
.entry{border-left:4px solid var(--honey);padding:4px 0 4px 12px}
.entry h3{font-size:16px}
.entry p{margin:2px 0 0;font-size:14px}
.entry.locked{border-color:var(--line);color:var(--ink-soft)}
.log{font-size:13px;color:var(--ink-soft);display:grid;gap:3px;margin:0;padding-left:18px}

/* modal */
.modal{position:fixed;inset:0;background:#2b1e164d;display:grid;place-items:center;z-index:20;
  padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));backdrop-filter:blur(2px)}
.sheet{width:min(580px,100%);max-height:100%;overflow:auto;background:var(--paper);border-radius:24px;box-shadow:0 20px 50px #0004;padding:18px;display:grid;gap:14px;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.shead{display:flex;gap:14px;align-items:center}
.portrait{width:96px;height:96px;flex:none;object-fit:contain;animation:idle 2.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes idle{50%{transform:scaleY(.95) scaleX(1.04)}}
.portrait.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-18px) scaleY(1.06)}70%{transform:scaleY(.9) scaleX(1.08)}}
.shead h2{font-size:26px;line-height:1.1}
.shead .rel{font-size:13px;color:var(--ink-soft)}
.shead .x{margin-left:auto;align-self:flex-start;border:0;background:var(--meadow);width:36px;height:36px;border-radius:50%;font-size:18px;flex:none}
.say{background:var(--meadow);border-radius:16px;padding:12px 16px;font-size:16px;position:relative;min-height:56px}
.say::before{content:"";position:absolute;left:30px;top:-10px;border:10px solid transparent;border-top:0;border-bottom-color:var(--meadow)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-soft)}
.story h2{font-size:24px}
.story p{margin:0 0 10px;font-size:15.5px}
.story .eyebrow{font-size:12px;letter-spacing:.12em;color:var(--berry-deep);text-transform:uppercase}

/* mini games */
.mg{display:grid;gap:12px}
.mg-tip{margin:0;font-size:14px;color:var(--ink-soft)}
.mg-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--display);font-size:17px}
.arena{position:relative;height:280px;border-radius:16px;overflow:hidden;background:linear-gradient(#cfe9fb,#eaf6ff);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tbar{position:relative;height:42px;border-radius:21px;background:var(--line);overflow:hidden}
.tzone{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,var(--honey),#ffd77d);border-radius:12px}
.tmark{position:absolute;top:-4px;bottom:-4px;width:8px;margin-left:-4px;background:var(--ink);border-radius:4px}
.tbar.hit{box-shadow:0 0 0 4px var(--good)}
.tbar.miss{box-shadow:0 0 0 4px var(--berry)}
.bub{position:absolute;width:58px;height:58px;border-radius:50%;border:0;padding:0;
  background:radial-gradient(circle at 32% 28%,#fff 0 9%,transparent 10%),conic-gradient(from 40deg,#ffb3d966,#b3e0ff88,#d9b3ff77,#fff1a866,#ffb3d966);box-shadow:inset 0 0 12px #fff,0 0 0 2px #ffffffaa}
.bub.p{animation:burst .25s forwards}
@keyframes burst{to{transform:scale(1.6);opacity:0}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px;height:100%;background:linear-gradient(#e9dcc3,#d8c6a3)}
.pod{border:0;border-radius:50% 50% 46% 46%;background:#a88f6a33;font-size:34px;display:grid;place-items:center;transition:transform .1s}
.pod.ripe{background:#7a4a2a}
.pod.green{background:#7fb26b}
.pod:active{transform:scale(.92)}
.pod.ripe::after{content:"🍫"}
.pod.green::after{content:"🌱"}
.tapbtn{width:150px;height:150px;border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#fff,#ffe9ef 60%,#f9c9d6);font-family:var(--display);font-size:22px;box-shadow:0 6px 0 #e8a9b9;margin:auto}
.tapbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #e8a9b9}
.whip{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.whip i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fff,var(--berry))}
.night-sky{background:radial-gradient(ellipse at 30% 20%,#5a4fb0 0,transparent 50%),linear-gradient(#1c1a44,#3b2f7a)}
.star{position:absolute;width:40px;height:40px;transform:translate(-50%,-50%);border:0;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,#bfe8ff66 30%,transparent 62%);color:#1c1a44;font-family:var(--display);font-size:13px;padding-top:20px}
.star span{color:#dff;font-size:12px;position:absolute;left:50%;top:-4px;transform:translateX(-50%)}
.star.on{background:radial-gradient(circle,#fff 0 22%,#ffe58a 34%,transparent 66%)}
.star.bad{animation:shake .3s}
@keyframes shake{25%{margin-left:-5px}75%{margin-left:5px}}
.river{background:linear-gradient(#bfe3fb 0 35%,#5ea9de 35%,#3f86c4)}
.bobber{position:absolute;left:50%;top:44%;width:26px;height:36px;transform:translateX(-50%);border-radius:50% 50% 45% 45%;background:linear-gradient(#ff5b6e 0 50%,#fff 50%);transition:top .12s}
.bobber.dip{top:52%}
.ripple{position:absolute;left:50%;top:54%;width:90px;height:22px;transform:translateX(-50%);border-radius:50%;border:2px solid #fff8}
.cave{background:radial-gradient(circle at 50% 70%,#5a4436,#2a201a)}
.still-gauge{position:absolute;left:10%;right:10%;bottom:18px;height:12px;border-radius:6px;background:#ffffff22;overflow:hidden}
.still-gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb84d,#ffe28a)}
.tempt{position:absolute;border:0;border-radius:999px;padding:6px 14px;background:#fffdf7;font-family:var(--display);font-size:15px;box-shadow:0 3px 0 #0003}
.rock-face{position:absolute;left:50%;top:44%;width:150px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 0 #ffb84d);transition:filter .4s}
.result{text-align:center;display:grid;gap:8px;justify-items:center;padding:8px 0}
.result .big{font-family:var(--display);font-size:34px}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center;animation:pop .2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="hud">
    <div class="brand"><h1>말랑별 <span>토끼마을</span></h1><small>인간의 손이 닿지 않는 작은 행성</small></div>
    <div class="stat" title="날짜"><b>말랑력</b><span id="day">1일째</span></div>
    <div class="stat" title="오늘 남은 일손"><b>일손</b><span class="pips" id="pips"></span></div>
    <div class="stat" title="마을 화합도"><b id="harmLabel">낯선 이웃</b><span class="harm"><i id="harmBar" style="width:0"></i></span><span id="harmNum">0</span></div>
    <button class="btn" id="endDay">하루 마치기</button>

  <div class="main">

 ['빵집 새벽 오븐이 대성공! 빵이 하나 남았대요.','bread'],
 ['솜사탕토끼가 그네에서 구름을 한 움큼 뜯어 왔어요.','cotton'],
 ['바위집 문 앞에 반짝돌 하나가 조용히 놓여 있었어요.','rock'],
 ['바람이 불어 비눗방울이 마을 곳곳에 걸렸어요.','bubble'],
];
const ENERGY=6;

/* ---------- state ---------- */
const fresh=()=>({day:1,energy:ENERGY,inv:Object.fromEntries(ORDER.map(k=>[k,0])),bond:Object.fromEntries(ORDER.map(k=>[k,0])),talked:[],harmony:0,done:[],chapters:['intro'],daily:[],dailySeq:0,deco:[],owned:{},decoSeq:0,seenEv:[],pendingEv:null,log:['1일째 · 반짝이가 말랑별에 떨어졌다.'],seenIntro:false});
let S=load()||fresh();
function load(){try{const v=JSON.parse(localStorage.getItem('mallang-v1'));if(v&&v.inv)return Object.assign(fresh(),v)}catch(e){}return null}
function save(){try{localStorage.setItem('mallang-v1',JSON.stringify(S))}catch(e){}}

const $=s=>document.querySelector(s);
const img=k=>`assets/bunnies/${k}.png`;
const tierOf=k=>S.bond[k]>=7?2:S.bond[k]>=3?1:0;
const hearts=k=>'♥'.repeat(Math.min(5,Math.ceil(S.bond[k]/2)))+'♡'.repeat(5-Math.min(5,Math.ceil(S.bond[k]/2)));
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- render ---------- */
let tab='q';
function render(){
 $('#day').textContent=S.day+'일째';
 $('#pips').innerHTML=Array.from({length:ENERGY},(_,i)=>`<i class="pip ${i<S.energy?'':'off'}"></i>`).join('');
 const lvl=[...TIERS].reverse().find(t=>S.harmony>=t[0]);
 const next=TIERS.find(t=>t[0]>S.harmony);
 $('#harmLabel').textContent=lvl[1];
 $('#harmNum').textContent=S.harmony;
 $('#harmBar').style.width=(next?((S.harmony-lvl[0])/(next[0]-lvl[0])*100):100)+'%';
 $('#scene').classList.toggle('cracks',S.chapters.includes('cracks'));
 renderHot();renderInv();renderTab();
}
function renderHot(){
 const askers=new Set(board().filter(canDo).map(q=>q.by));
 const any=new Set(board().map(q=>q.by));
 ORDER.forEach(k=>{
  const el=P[k]&&P[k].el;if(!el)return;
  el.querySelector('.ask')?.remove();
  if(any.has(k))el.insertAdjacentHTML('beforeend',`<span class="ask" title="부탁이 있어요">${askers.has(k)?'♥':'!'}</span>`);
 });
 renderDecos();
 const sc=$('#scene');sc.querySelector('.evchip')?.remove();
 if(S.pendingEv&&!EV.on){const c=document.createElement('button');c.className='evchip';c.textContent='오늘의 마을 이야기 ▶';c.onclick=()=>playEvent(S.pendingEv);sc.appendChild(c)}
}
function renderInv(){
 $('#inv').innerHTML=ORDER.map(k=>`<div class="slot" id="slot-${k}" title="${B[k].name}에게서 얻어요"><span class="ic">${B[k].icon}</span><span class="n">${S.inv[k]}</span><span class="l">${B[k].item}</span></div>`).join('');
}
function board(){
 const open=QUESTS.filter(q=>!S.done.includes(q.id)&&(!q.req||q.req(S)));
 const main=open.slice(0,3);
 if(main.length<3){while(S.daily.length<3-main.length)S.daily.push(makeDaily());return main.concat(S.daily.slice(0,3-main.length))}
 return main;
}
function makeDaily(){
 const by=pick(ORDER.filter(k=>k!=='rock'));const ks=ORDER.filter(k=>k!==by&&(k!=='rock'||Math.random()<.3));
 const need={};need[by]=1+Math.floor(Math.random()*2);for(let i=0;i<2;i++){const k=pick(ks);need[k]=(need[k]||0)+1}
 const names=['오늘의 간식 나눔','언덕 청소 당번','이웃집 생일 선물','다리 난간 꾸미기','저녁 별 구경 준비','강가 소풍 도시락'];
 return {id:'d'+(++S.dailySeq),by,t:pick(names),d:`${B[by].name}의 오늘 부탁이에요.`,need,h:6,daily:1};
}
const canDo=q=>Object.entries(q.need).every(([k,n])=>S.inv[k]>=n);
function renderTab(){
 document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));
 const tb=$('#tabbody');
 if(tab==='q'){
  tb.innerHTML=board().map(q=>`<div class="quest ${q.big?'big':''} ${q.mystery?'mystery':''}">
   <div class="qhead"><img src="${img(q.by)}" alt=""><div><h3>${q.t}</h3><small>${q.mystery?'보낸 이: ???':B[q.by].name}${q.daily?' · 오늘의 부탁':''}</small></div></div>
   <p>${q.d}</p>
   <div class="needs">${Object.entries(q.need).map(([k,n])=>`<span class="need ${S.inv[k]>=n?'ok':''}">${B[k].icon} ${B[k].item} ${Math.min(S.inv[k],n)}/${n}</span>`).join('')}</div>
   <div class="qfoot"><span>화합도 +${q.h}</span><button class="btn pink" data-q="${q.id}" ${canDo(q)?'':'disabled'}>전달하기</button></div></div>`).join('')
   +`<p class="mg-tip">토끼를 눌러 일손을 도우면 재료를 얻어요. 일손은 하루 ${ENERGY}번, 하루를 마치면 다시 채워져요.</p>`;
  tb.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>deliver(b.dataset.q));
 } else if(tab==='d'){
  const placed=t=>S.deco.filter(d=>d.t===t).length;
  tb.innerHTML=`<div class="deco-top"><p class="mg-tip" style="flex:1;min-width:160px">재료로 장식을 만들어 마을에 놓아요. 좋아하는 토끼 집 근처에 놓으면 아주 기뻐해요.</p>
    <button class="btn ${decoMode?'pink':'alt'}" id="decoMode">${decoMode?'꾸미기 끝내기':'놓인 장식 옮기기'}</button></div>`+
   Object.entries(DECOS).map(([t,d])=>{const ok=Object.entries(d.cost).every(([k,n])=>S.inv[k]>=n);const own=S.owned[t]||0;
    return `<div class="deco-card"><div class="pv">${decoSvg(t)}</div><div style="min-width:0"><h3>${d.n}</h3>
     <small>${d.fav?'좋아하는 토끼 · '+B[d.fav].name:'모두가 좋아해요'} · 마을에 ${placed(t)}개</small>
     <div class="row">${Object.entries(d.cost).map(([k,n])=>`<span class="need ${S.inv[k]>=n?'ok':''}">${B[k].icon} ${Math.min(S.inv[k],n)}/${n}</span>`).join('')}</div>
     <div class="row"><button class="btn pink" data-make="${t}" ${ok?'':'disabled'}>만들기</button>${own?`<button class="btn" data-place="${t}">놓기 (보관 ${own})</button>`:''}</div></div></div>`}).join('');
  tb.querySelectorAll('[data-make]').forEach(b=>b.onclick=()=>makeDeco(b.dataset.make));
  tb.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>startPlacing(b.dataset.place));
  $('#decoMode').onclick=()=>{decoMode=!decoMode;$('#scene').classList.toggle('decorating',decoMode);renderTab()};
 } else if(tab==='f'){
  const m=k=>`<button class="fm" data-b="${k}"><img src="${img(k)}" alt=""><span>${B[k].name.replace('토끼','')}</span><span class="hearts">${hearts(k)}</span></button>`;
  tb.innerHTML=`<div class="fam">
   <div class="fgroup"><h3>디저트 삼남매</h3><p>같은 오븐 옆에서 태어난 형제</p><div class="fmembers">${m('choco')}<span class="link">형제</span>${m('pudding')}<span class="link">형제</span>${m('bread')}</div></div>
   <div class="bridge"><b>크림토끼</b>는 삼남매의 사촌이자 솜사탕의 언니. 두 가족을 잇는 케이크 친척이에요.</div>
   <div class="fgroup"><h3>폭신 자매</h3><p>같은 설탕 구름에서 왔대요</p><div class="fmembers">${m('cream')}<span class="link">자매</span>${m('cotton')}</div></div>
   <div class="fgroup"><h3>하늘 남매</h3><p>낮 하늘은 구름, 밤 하늘은 오로라</p><div class="fmembers">${m('aurora')}<span class="link">남매</span>${m('cloud')}<span class="link maybe">아마도 친척?</span>${m('bubble')}</div></div>
   <div class="fgroup" style="background:#ece8f4"><h3>???</h3><p>${S.chapters.includes('memory')?'이 별이 식기 전부터 있었다. 모두의 따뜻함과 관련이 있는 것 같다.':'아무도 그의 가족을 모른다.'}</p><div class="fmembers">${m('rock')}</div></div>
  </div>`;
  tb.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>openBunny(b.dataset.b));
 } else {
  const keys=Object.keys(CH);
  tb.innerHTML=`<div class="journal">${keys.map(k=>S.chapters.includes(k)?`<button class="entry" data-c="${k}" style="text-align:left;border-top:0;border-right:0;border-bottom:0;background:none"><h3>${CH[k].t}</h3><p>${CH[k].p[0].slice(0,60)}…</p></button>`:`<div class="entry locked"><h3>잠긴 이야기</h3><p>조건: ${CH[k].at}</p></div>`).join('')}</div>
   <h3 style="font-size:16px;margin-top:6px">마을 이야기</h3><div class="needs">${Object.entries(STORIES).map(([id,e])=>S.seenEv.includes(id)?`<button class="btn alt" style="padding:4px 12px;font-size:14px" data-ev="${id}">▶ ${e.t}</button>`:`<span class="need">잠김 · ???</span>`).join('')}</div>
   <h3 style="font-size:16px;margin-top:6px">마을 소식</h3><ul class="log">${S.log.slice(-8).reverse().map(l=>`<li>${l}</li>`).join('')}</ul>
   <div><button class="btn alt" id="reset">처음부터 다시</button></div>`;
  tb.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>showChapter(b.dataset.c));
  tb.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>playEvent(b.dataset.ev));
  const r=$('#reset');r.onclick=()=>{if(r.dataset.sure){S=fresh();save();render();toast('새 별똥별이 떨어졌어요.')}else{r.dataset.sure=1;r.textContent='정말 지울까요? 한 번 더 누르기'}};
 }
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;renderTab()});
$('#toggleLabels').onclick=e=>{const on=$('#scene').classList.toggle('labels');e.target.textContent=on?'이름표 숨기기':'이름표 보기'};

/* ---------- interactions ---------- */
function toast(t){document.querySelectorAll('.toast').forEach(e=>e.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function floatAt(k,t){const f=document.createElement('div');f.className='float';const q=P[k]||{x:B[k].x*15.36,y:B[k].y*10.24+60};f.style.left=q.x/15.36+'%';f.style.top=(q.y-90)/10.24+'%';f.style.zIndex=1800;f.textContent=t;$('#scene').appendChild(f);setTimeout(()=>f.remove(),1500)}
function addLog(t){S.log.push(`${S.day}일째 · ${t}`);if(S.log.length>40)S.log.shift()}
function gain(k,n){S.inv[k]+=n;save();renderInv();const s=$('#slot-'+k);if(s){s.classList.remove('bump');void s.offsetWidth;s.classList.add('bump')}}
function addHarmony(n){const before=S.harmony;S.harmony+=n;
 TIERS.forEach(t=>{if(before<t[0]&&S.harmony>=t[0])setTimeout(()=>toast(`마을 화합도가 「${t[1]}」 단계가 되었어요!`),900)});
 if(S.harmony>=45&&!S.chapters.includes('cracks'))unlock('cracks');}
function unlock(c){if(S.chapters.includes(c))return;S.chapters.push(c);addLog(`새 이야기 「${CH[c].t}」`);save();setTimeout(()=>showChapter(c),400)}

let G=null; // active minigame cleanup
function closeModal(){if(G){G();G=null}$('#modal').hidden=true;render()}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!inChoice)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden&&!inChoice)closeModal()});
function sheet(html){$('#sheet').innerHTML=html;$('#modal').hidden=false;const x=$('#sheet .x');if(x)x.onclick=closeModal}
const head=(k,sub)=>`<div class="shead"><img class="portrait" id="por" src="${img(k)}" alt=""><div><h2>${B[k].name}</h2><div class="rel">${sub||REL[k]}</div><div class="hearts">${hearts(k)}</div></div><button class="x" aria-label="닫기">✕</button></div>`;

function openBunny(k){
 if(EV.on){toast('마을 이야기가 진행 중이에요.');return}
 const lines=LINES[k][tierOf(k)];
 const talked=S.talked.includes(k);
 sheet(`${head(k)}
  <div class="say" id="say">${lines[0]}</div>
  <div class="meta"><span>사는 곳 · ${B[k].home}</span><span>${k==='rock'&&tierOf(k)<2?'성격 · ???':B[k].who}</span></div>
  <div class="acts">
   <button class="btn alt" id="talk">${talked?'이야기 더 듣기':'이야기 나누기 ♥+1'}</button>
   <button class="btn pink" id="help" ${S.energy<1?'disabled':''}>일손 돕기 · ${B[k].gname}</button>
  </div>
  <p class="mg-tip">${S.energy<1?'오늘 일손을 다 썼어요. 「하루 마치기」로 내일을 맞아요.':`돕기는 일손 1을 써요. 보상: ${B[k].icon} ${B[k].item}`}</p>`);
 let li=0;
 $('#talk').onclick=()=>{li=(li+1)%lines.length;$('#say').textContent=lines[li];hop();
  if(!S.talked.includes(k)){S.talked.push(k);S.bond[k]++;addHarmony(1);save();$('#talk').textContent='이야기 더 듣기';$('#sheet .hearts').textContent=hearts(k);floatAt(k,'♥')}};
 $('#help').onclick=()=>startGame(k);
}
function hop(){const p=$('#por');if(!p)return;p.classList.remove('hop');void p.offsetWidth;p.classList.add('hop')}

function deliver(id){
 const q=board().find(q=>q.id===id);if(!q||!canDo(q))return;
 Object.entries(q.need).forEach(([k,n])=>S.inv[k]-=n);
 if(q.daily)S.daily=S.daily.filter(d=>d.id!==id);else S.done.push(id);
 S.bond[q.by]+=2;addHarmony(q.h);addLog(`「${q.t}」 부탁을 들어줬다.`);floatAt(q.by,`화합 +${q.h}`);
 save();render();
 if(q.ch)unlock(q.ch);else toast(`${q.mystery?'바위집 문이 살짝 열렸다…':B[q.by].name+': 고마워!'} 화합도 +${q.h}`);
}
function showChapter(c){
 sheet(`<div class="story"><div class="shead" style="margin-bottom:10px"><div><div class="eyebrow">마을 일지 · ${CH[c].at}</div><h2>${CH[c].t}</h2></div><button class="x" aria-label="닫기">✕</button></div>${CH[c].p.map(p=>`<p>${p}</p>`).join('')}</div><div><button class="btn" id="ok">계속하기</button></div>`);
 $('#ok').onclick=closeModal;
}
$('#endDay').onclick=()=>{
 if(EV.on)return;
 const sc=$('#scene');sc.classList.add('night');$('#endDay').disabled=true;
 setTimeout(()=>{
  S.day++;S.energy=ENERGY;S.talked=[];S.daily=[];
  const ev=Math.random()<(S.chapters.includes('cracks')?.75:.6)?pick(EVENTS.filter(e=>e[1]!=='rock'||S.bond.rock>=2)):null;
  let msg=`${S.day}일째 아침이 밝았어요.`;
  if(ev){gain(ev[1],1);addLog(ev[0]);msg+=' '+ev[0]}
  S.pendingEv=nextEvent();if(S.pendingEv)msg+=' 마을에 무슨 일이 있는 것 같아요!';
  save();sc.classList.remove('night');$('#endDay').disabled=false;render();toast(msg);
 },1500);
};

/* ---------- mini games ---------- */
function startGame(k){
 if(S.energy<1)return;S.energy--;save();
 const g=B[k].game;
 sheet(`${head(k,B[k].gname)}<div class="mg" id="mg"></div>`);
 const el=$('#mg');
 const done=score=>{if(G){G();G=null}finish(k,score)};
 const cfg={
  cotton:{tip:'그네가 노란 구간에 왔을 때 밀어 주세요! 세 번.',btn:'밀기!',speed:70,w:20},
  pudding:{tip:'캐러멜이 딱 황금빛일 때 불을 꺼요. 세 번.',btn:'불 끄기',speed:95,w:16},
  bread:{tip:'빵 껍질이 노릇노릇할 때 오븐에서 꺼내요. 세 번.',btn:'꺼내기!',speed:120,w:14},
 }[k];
 G=GAMES[g](el,done,cfg||{});
}
function finish(k,score){
 const n=Math.max(1,score);gain(k,n);S.bond[k]++;addHarmony(1);
 const said={0:'괜찮아, 다음엔 더 잘할 거야.',1:'고마워! 도움이 됐어.',2:'와, 손이 빠른데?',3:'최고야! 우리 마을 일꾼!'}[Math.min(3,score)];
 const rockSaid=['…(고개를 끄덕인다)','…좋아.','…따뜻하네.','…고마워, 반짝이.'][Math.min(3,score)];
 save();
 $('#mg').innerHTML=`<div class="result"><div class="big">${B[k].icon} ×${n}</div><div class="say" style="width:100%">${k==='rock'?rockSaid:said}</div><div class="hearts">${hearts(k)}</div>
  <div class="acts"><button class="btn alt" id="back">${B[k].name}에게 돌아가기</button>${S.energy>0?`<button class="btn pink" id="again">한 번 더 (일손 ${S.energy})</button>`:''}</div></div>`;
 hop();floatAt(k,`${B[k].icon}+${n}`);
 $('#back').onclick=()=>openBunny(k);const a=$('#again');if(a)a.onclick=()=>startGame(k);
}
const GAMES={
 timing(el,done,c){
  el.innerHTML=`<p class="mg-tip">${c.tip}</p><div class="tbar" id="tb"><div class="tzone" id="tz"></div><div class="tmark" id="tm"></div></div>
   <div class="mg-row"><span id="tr">1 / 3 · 성공 0</span><button class="btn big pink" id="tg">${c.btn}</button></div><p class="mg-tip">스페이스바로도 누를 수 있어요.</p>`;
  let pos=0,dir=1,zone=0,round=0,hits=0,last=performance.now(),raf,lock=false;
  const tb=$('#tb'),tm=$('#tm'),tz=$('#tz');
  const nz=()=>{zone=10+Math.random()*(80-c.w);tz.style.left=zone+'%';tz.style.width=c.w+'%'};nz();
  const loop=t=>{const dt=(t-last)/1000;last=t;if(!lock){pos+=dir*c.speed*dt;if(pos>100){pos=100;dir=-1}if(pos<0){pos=0;dir=1}tm.style.left=pos+'%'}raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop);
  const press=()=>{if(lock)return;lock=true;const hit=pos>=zone-1&&pos<=zone+c.w+1;hits+=hit;tb.className='tbar '+(hit?'hit':'miss');round++;
   $('#tr').textContent=`${Math.min(round+1,3)} / 3 · 성공 ${hits}`;
   setTimeout(()=>{tb.className='tbar';if(round>=3)done(hits);else{nz();lock=false;c.speed*=1.12}},550)};
  $('#tg').onclick=press;const kd=e=>{if(e.code==='Space'){e.preventDefault();press()}};document.addEventListener('keydown',kd);
  return ()=>{cancelAnimationFrame(raf);document.removeEventListener('keydown',kd)};
 },
 tap(el,done){
  el.innerHTML=`<p class="mg-tip">5초 동안 최대한 빨리 저어서 크림을 단단하게 휘핑해요!</p><div class="whip"><i id="wb"></i></div>
   <div class="arena" style="height:220px;display:grid;background:linear-gradient(#fff5f7,#ffe3ea)"><button class="tapbtn" id="tp">눌러서 시작</button></div><div class="mg-row"><span id="tt">5.0초</span><span id="tc">0회</span></div>`;
  let n=0,t0=0,iv;const tp=$('#tp');
  tp.onclick=()=>{if(!t0){t0=performance.now();tp.textContent='휘휘!';iv=setInterval(()=>{const left=5-(performance.now()-t0)/1000;$('#tt').textContent=Math.max(0,left).toFixed(1)+'초';if(left<=0){clearInterval(iv);tp.disabled=true;done(n>=32?3:n>=22?2:n>=10?1:0)}},50)}
   n++;$('#tc').textContent=n+'회';$('#wb').style.width=Math.min(100,n/32*100)+'%';tp.style.transform=`rotate(${n%2?-6:6}deg)`};
  return ()=>clearInterval(iv);

const HOME={choco:[285,362],bubble:[612,365],cotton:[1167,305],pudding:[335,590],bread:[705,612],cream:[1290,600],aurora:[357,912],cloud:[752,908],rock:[1216,962]};
const MEET={cotton:[1185,395],cloud:[650,885]};
const NODES={a:[430,385],b:[545,420],c:[590,560],d:[470,650],e:[860,640],f:[1000,560],g:[1120,430],h:[1250,370],i:[1150,620],j:[1080,880],k:[560,870],l:[950,960],m:[230,700]};
ORDER.forEach(k=>NODES['h_'+k]=HOME[k]);
const ADJ={};
'h_choco-a a-b h_bubble-b b-c a-c c-d h_pudding-d h_pudding-m m-h_aurora d-k h_aurora-k k-h_cloud h_cloud-l l-j j-h_rock j-i c-h_bread d-h_bread h_bread-e e-f e-i f-g g-h h-h_cotton f-i i-h_cream'
 .split(' ').forEach(e=>{const [u,v]=e.split('-');(ADJ[u]=ADJ[u]||[]).push(v);(ADJ[v]=ADJ[v]||[]).push(u)});
const dist=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1]);
function route(a,b){const D={},prev={},Q=new Set(Object.keys(NODES));for(const n of Q)D[n]=Infinity;D[a]=0;
 while(Q.size){let u=null;for(const n of Q)if(u===null||D[n]<D[u])u=n;Q.delete(u);if(u===b)break;
  for(const v of ADJ[u]||[]){const nd=D[u]+dist(NODES[u],NODES[v]);if(nd<D[v]){D[v]=nd;prev[v]=u}}}
 const r=[];for(let n=b;n;n=prev[n])r.unshift(n);return r[0]===a?r:[a,b]}
const nearest=pt=>Object.keys(NODES).reduce((best,n)=>dist(NODES[n],pt)<dist(NODES[best],pt)?n:best,'c');
const SPEED=210;
const P={};
const EV={on:false,skip:false};let inChoice=false,decoMode=false,placing=null,walkers=0;
const pend=new Set();
const sizeAt=y=>6.2+y/1024*8;
function setPos(k,x,y){const p=P[k];p.x=x;p.y=y;const el=p.el;el.style.left=x/15.36+'%';el.style.top=y/10.24+'%';el.style.width=sizeAt(y)+'%';el.style.zIndex=Math.round(y)}
function initScene(){
 const sc=$('#scene');sc.querySelectorAll('.bun').forEach(e=>e.remove());
 ORDER.forEach((k,i)=>{const el=document.createElement('button');el.className='bun';el.style.setProperty('--d',`-${(i*.53)%3.8}s`);el.setAttribute('aria-label',B[k].name+'에게 말 걸기');
  el.innerHTML=`<img src="${img(k)}" alt=""><span class="tag">${B[k].name}</span>`;
  el.onclick=()=>{if(placing||decoMode)return;openBunny(k)};sc.appendChild(el);
  P[k]={el,x:0,y:0,busy:false,tok:0};setPos(k,...HOME[k])});
 if(!initScene.once){initScene.once=1;sc.addEventListener('click',sceneClick);setInterval(ambient,4200)}
}
function stepTo(k,pt,tok){return new Promise(res=>{const p=P[k];
 if(tok!==p.tok)return res();
 if(EV.on&&EV.skip){setPos(k,...pt);return res()}
 const sx=p.x,sy=p.y,dur=Math.max(60,dist([sx,sy],pt)/SPEED*1000),t0=performance.now();
 const f=t=>{if(tok!==p.tok)return res();if(EV.on&&EV.skip){setPos(k,...pt);return res()}
  const u=Math.min(1,(t-t0)/dur);setPos(k,sx+(pt[0]-sx)*u,sy+(pt[1]-sy)*u);u<1?requestAnimationFrame(f):res()};
 requestAnimationFrame(f)})}
async function walk(k,dest,tok=P[k].tok){const p=P[k];
 const path=route(nearest([p.x,p.y]),nearest(dest)).map(n=>NODES[n]);
 if(path.length>1&&dist([p.x,p.y],path[1])<dist(path[0],path[1]))path.shift();
 if(path.length&&dist(path[path.length-1],dest)<dist([p.x,p.y],dest)&&dist([p.x,p.y],dest)<120)path.length=0;
 path.push(dest);p.el.classList.add('walking');
 for(const pt of path){if(tok!==p.tok)break;await stepTo(k,pt,tok)}
 if(tok===p.tok)p.el.classList.remove('walking')}
const home=k=>walk(k,HOME[k]);
function spot(host,i){const b=MEET[host]||HOME[host];const o=[[-115,22],[115,22],[-70,72],[70,72],[-175,60],[175,60],[0,105],[-125,118]][i%8];
 return [Math.min(1490,Math.max(50,b[0]+o[0])),Math.min(1005,Math.max(140,b[1]+o[1]))]}
function wait(ms){return new Promise(r=>{if(EV.on&&EV.skip)return r();let id;const fin=()=>{clearTimeout(id);pend.delete(fin);r()};id=setTimeout(fin,ms);if(EV.on)pend.add(fin)})}
function say(k,t,ms){const el=P[k].el;el.querySelector('.sayb')?.remove();const b=document.createElement('div');b.className='sayb';b.textContent=t;el.appendChild(b);
 return wait(ms||1400+t.length*55).then(()=>b.remove())}

function choice(k,q,opts){return new Promise(res=>{
 if(EV.skip)return res(0);
 inChoice=true;
 sheet(`<div class="shead"><img class="portrait" src="${img(k)}" alt=""><div><h2>${B[k].name}</h2><div class="rel">${REL[k]}</div></div></div><div class="say">${q}</div><div class="choice">${opts.map((o,i)=>`<button class="btn alt" data-i="${i}">${o}</button>`).join('')}</div>`);

   const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);checkFav(d);save()};

/* ---------- floating fluff ---------- */
function initFluff(){
 const cv=$('#fluff'),cx=cv.getContext('2d'),cols=['#ffd6e6','#d7ecff','#fff3c4','#e8dcff','#ffffff'];
 const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
 let W=0,H=0;const fit=()=>{const d=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)};fit();addEventListener('resize',fit);
 const ps=Array.from({length:22},()=>({x:Math.random(),y:Math.random(),r:2+Math.random()*5,v:.006+Math.random()*.012,ph:Math.random()*6.3,c:pick(cols),ring:Math.random()<.35}));
 let last=performance.now();
 const draw=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;cx.clearRect(0,0,W,H);
  for(const p of ps){if(!still){p.y-=p.v*dt;if(p.y<-.05){p.y=1.05;p.x=Math.random()}}
   const x=(p.x+Math.sin(t/2600+p.ph)*.012)*W,y=p.y*H,r=p.r*W/900;
   if(p.ring){cx.strokeStyle='#ffffffb0';cx.lineWidth=1;cx.beginPath();cx.arc(x,y,r*1.6,0,7);cx.stroke();cx.fillStyle='#ffffff90';cx.beginPath();cx.arc(x-r*.5,y-r*.5,r*.35,0,7);cx.fill()}
   else{const g=cx.createRadialGradient(x,y,0,x,y,r*2);g.addColorStop(0,p.c+'ee');g.addColorStop(1,p.c+'00');cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r*2,0,7);cx.fill()}}
  if(!still&&!document.hidden)requestAnimationFrame(draw)};
 requestAnimationFrame(draw);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!still){last=performance.now();requestAnimationFrame(draw)}});
}
/* ---------- boot ---------- */
function start(data){
 if(data&&data.S&&data.S.inv)S=Object.assign(fresh(),data.S);
 initScene();
 if(!initFluff.once){initFluff.once=1;initFluff()}
 render();
 if(!S.seenIntro){S.seenIntro=true;save();showChapter('intro')}
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
